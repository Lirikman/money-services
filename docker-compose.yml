services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abakan2026
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - my-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  gw-exchanger:
    build:
      context: .               
      dockerfile: ./cmd/gw-exchanger/Dockerfile
    container_name: gw-exchanger-svc
    env_file:
      - ./cmd/gw-exchanger/config.env
    ports:
      - "50051:50051"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - my-network
  
  gw-currency-wallet:
    build:
      context: .               
      dockerfile: ./cmd/gw-currency-wallet/Dockerfile
    container_name: gw-wallet-svc
    env_file:
      - ./cmd/gw-currency-wallet/config.env
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
      kafka-brokers:
        condition: service_healthy
    networks:
      - my-network

  mongo-db:
    image: mongo:7.0
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongo_data:/data/db
    networks:
      - my-network
    healthcheck:
      test: ["CMD", "mongosh", "--username", "root", "--password", "secret", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
      
  gw-notification:
    build:
      context: .               
      dockerfile: ./cmd/gw-notification/Dockerfile
    container_name: gw-notification-svc
    env_file:
      - ./cmd/gw-notification/config.env
    depends_on:
      mongo-db:
        condition: service_healthy
      kafka-brokers:
        condition: service_healthy
    networks:
      - my-network

  clickhouse-db:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123" 
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      - CLICKHOUSE_DB=analytics
      - CLICKHOUSE_USER=analytics
      - CLICKHOUSE_PASSWORD=analytics_password
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    networks:
      - my-network
  
  gw-analytics:
    build:
      context: .               
      dockerfile: ./cmd/gw-analytics/Dockerfile
    container_name: gw-analytics-svc
    env_file:
      - ./cmd/gw-analytics/config.env
    depends_on:
      clickhouse-db:
        condition: service_healthy
      kafka-brokers:
        condition: service_healthy
    networks:
      - my-network

  kafka-brokers:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - my-network

  ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka-brokers
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  pgdata:
  mongo_data:
  clickhouse-data:
  clickhouse-logs: